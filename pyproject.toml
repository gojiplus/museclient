[project]
name = "museclient"
version = "0.1.0"
description = "Cached, budget-capped calls to Meta's Muse Spark"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gaurav Sood"}]
keywords = ["llm", "muse-spark", "meta", "budget", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=3.35",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.9", "pyright>=1.1.390", "pydoclint>=0.5"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[project.urls]
Homepage = "https://github.com/gojiplus/museclient"
Repository = "https://github.com/gojiplus/museclient"
Issues = "https://github.com/gojiplus/museclient/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv.build-backend]
module-name = "museclient"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-config", "--strict-markers"]
xfail_strict = true
log_level = "INFO"
filterwarnings = ["error"]
