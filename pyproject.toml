[project]
name = "museclient"
version = "0.1.0"
description = "Cached, budget-capped calls to Meta's Muse Spark"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gaurav Sood"}]
keywords = ["llm", "muse-spark", "meta", "budget", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.9"]

[project.urls]
Homepage = "https://github.com/gojiplus/museclient"
Repository = "https://github.com/gojiplus/museclient"
Issues = "https://github.com/gojiplus/museclient/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
